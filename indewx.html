<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Conversor Celsius a Fahrenheit</title>
</head>
<body>

<p id="resultado">Temperatura en Fahrenheit aparecerá aquí</p>

<script>
  // Función que convierte Celsius a Fahrenheit
  function celsiusAFahrenheit(celsius) {
    return (celsius * 9/5) + 32;
  }

  // Temperatura en Celsius que quieres convertir
  let celsius = 25;

  // Convertir y actualizar el texto del párrafo
  let fahrenheit = celsiusAFahrenheit(celsius);
  document.getElementById("resultado").textContent = celsius + "°C son " + fahrenheit + "°F";
</script>

</body>
</html>
